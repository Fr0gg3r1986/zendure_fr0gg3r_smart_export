# =============================================================================
# Zendure Smart Export — Price-Aware Evening/Vacation Export Control
# Version: 2.12.0 (2026-08-21)
# Author: Fr0gg3r1986
# https://github.com/Fr0gg3r1986/zendure-smart-export
#
# Changelog:
#   2.12.0 (2026-08-21)
#     - Added a low-solar-tomorrow export block: sensor.zendure_solar_forecast_tomorrow
#       sums Forecast.Solar's per-plane "tomorrow" estimate across all 3 real
#       solar systems (Huawei south, SolaX X1 east, SolaX X2 west).
#       binary_sensor.zendure_low_solar_tomorrow trips when that sum falls
#       below input_number.zendure_low_solar_threshold_kwh (default 5 kWh).
#       When tripped, evening export is blocked the same way the aircon
#       reserve block already works — preventing the battery being drained
#       by price-chasing export on an evening before a low-sun day, when it
#       may not fully recharge the next day. Overridable per-day via
#       input_boolean.zendure_ignore_low_solar_forecast.
#     - Requires the Forecast.Solar integration (or compatible) configured
#       per solar plane. See Dependencies section below.
#   2.11.0 (2026-08-20)
#     - Added sensor.zendure_true_total_state_of_charge — a capacity-weighted
#       SOC across the two proxy units (5.28 kWh + 2.4 kWh), correcting
#       Gielz1986's raw sensor.zendure_total_state_of_charge, which is a
#       naive (unweighted) average and was found to overstate available
#       energy by ~8-9 SOC points in an asymmetric multi-unit setup.
#     - Repointed all 7 reserve/export decision-logic checks and both
#       notification messages to the corrected sensor.
#     - Package renamed from "zendure_custom_evening_export" to
#       "Zendure Smart Export" ahead of publishing publicly; added author
#       credit and repo link. No functional changes from this rename.
#   2.10.1 (2026-07-08)
#     - Prior baseline. Consolidated final version predating this changelog;
#       see project history for details of earlier 2.x releases (SOC floor
#       clamping fix, choose-block revert logic fix, indirect entity
#       reference fixes, versioned dashboard split, vacation mode, arm/disarm
#       notifications with action buttons).
# =============================================================================
# Dependencies
#
# REQUIRED:
#   Gielz1986's Zendure integration package
#   https://github.com/Gielz1986/Zendure-HA-zenSDK
#   This package only ever references his entities by ID and never edits
#   his file — see the separation note below. Tested against his Global
#   (EN) Integration, v20260716.
#
# REQUIRED for multi-unit setups only (2+ physical Zendure hubs):
#   gast777's Zendure zenSDK proxy
#   https://github.com/gast777/Zendure-zenSDK-proxy
#   Needed if you're running more than one Zendure unit behind Gielz1986's
#   integration. Single-unit setups don't need this.
#
# REQUIRED for the low-solar-tomorrow export block:
#   The built-in Forecast.Solar integration, one instance per solar plane
#   (Settings -> Devices & Services -> Add Integration -> Forecast.Solar).
#   This package expects sensor.energy_production_tomorrow (+ _2, _3, ... for
#   additional planes) to exist. Update the entity IDs in the
#   "Zendure Solar Forecast Tomorrow" template sensor below to match your
#   actual instances if they differ. If you don't want this feature, just
#   leave input_number.zendure_low_solar_threshold_kwh at 0 — the block will
#   never trigger.
#
# KNOWN ISSUE — combined SOC is not capacity-weighted when using the proxy:
#   With multiple units of different capacities (e.g. one unit with a
#   battery expansion pack, one without), Gielz1986's combined
#   sensor.zendure_total_state_of_charge — which comes from the proxy's
#   electricLevel — appears to be a simple average across units rather than
#   weighted by their capacity. On an asymmetric 5.28 kWh / 2.4 kWh setup
#   this was found to overstate the true combined SOC by ~6-9 percentage
#   points. Reported upstream to gast777:
#   https://github.com/gast777/Zendure-zenSDK-proxy/issues/26
#   This package works around it independently — see
#   sensor.zendure_true_total_state_of_charge below, which computes the
#   correct capacity-weighted value from the individual per-unit proxy
#   sensors and is what all reserve/export logic here actually uses. If
#   you're on a single unit, or matched-capacity units, this workaround is
#   a no-op — Gielz1986's raw sensor is already correct in those cases.
# =============================================================================
# Separation from Gielz1986's integration
#
# This file is entirely separate from Gielz1986's integration package
# (zendure_gielz1986_global.yaml). It only ever REFERENCES his entities by ID
# (input_select.zendure_operation_mode, input_number.zendure_setting_minimum_
# allowed_state_of_charge, sensor.dynamic_highest_price_period). It never
# edits his file, so his updates never conflict with this one.
#
# Install: save as packages/zendure_fr0gg3r_smart_export.yaml
# Requires in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
# =============================================================================

input_datetime:
  zendure_export_reminder_time:
    name: Zendure - Export Reminder Time
    has_date: false
    has_time: true
    initial: "19:00:00"

input_select:
  zendure_revert_mode:
    name: Zendure - Revert To Mode
    icon: mdi:backup-restore
    initial: Smart Matching
    options:
      - Standby
      - Manual
      - Smart Matching
      - Smart Discharge Only
      - Smart Charge Only
      - Dynamic Smart Matching
      - Dynamic Smart Matching (Expensive)
      - Dynamic Trading
      - Dynamic Trading + Smart Matching
      - Quick Charge
      - Quick Discharge

input_text:
  zendure_custom_not_before_time_today:
    name: Zendure - Custom Export Start Time Tonight
    icon: mdi:clock-plus-outline

  zendure_bedroom1_temp_sensor:
    name: Bedroom 1 Temperature Sensor
    icon: mdi:thermometer
  zendure_bedroom2_temp_sensor:
    name: Bedroom 2 Temperature Sensor
    icon: mdi:thermometer
  zendure_bedroom3_temp_sensor:
    name: Bedroom 3 Temperature Sensor
    icon: mdi:thermometer

  zendure_bedroom1_airco:
    name: Bedroom 1 Airco Entity
    icon: mdi:air-conditioner
  zendure_bedroom2_airco:
    name: Bedroom 2 Airco Entity
    icon: mdi:air-conditioner
  zendure_bedroom3_airco:
    name: Bedroom 3 Airco Entity
    icon: mdi:air-conditioner

  zendure_notify_phone1:
    name: Zendure - Notify Phone 1
    icon: mdi:cellphone
  zendure_notify_phone2:
    name: Zendure - Notify Phone 2
    icon: mdi:cellphone

input_number:
  zendure_night_reserve_soc:
    name: Zendure - Reserve SOC
    min: 10
    max: 80
    step: 1
    initial: 50
    unit_of_measurement: "%"
    icon: mdi:battery-charging-40

  zendure_aircon_temp_threshold:
    name: Aircon Reserve Temperature Threshold
    min: 18
    max: 30
    step: 0.5
    initial: 25
    unit_of_measurement: "°C"
    icon: mdi:thermometer-alert

  zendure_export_not_before_hour:
    name: Zendure - Don't Export Before This Hour
    min: 0
    max: 23
    step: 1
    initial: 20
    icon: mdi:clock-time-eight-outline

  zendure_low_solar_threshold_kwh:
    name: Zendure - Low Solar Tomorrow Threshold
    min: 0
    max: 30
    step: 0.5
    initial: 5
    unit_of_measurement: "kWh"
    icon: mdi:weather-cloudy-alert

input_boolean:
  zendure_export_armed:
    name: Zendure - Allow price-based export (I'm away)
    icon: mdi:home-export-outline

  zendure_vacation_mode:
    name: Zendure - I'm on vacation
    icon: mdi:airplane

  zendure_notifications_enabled:
    name: Zendure - Notifications Enabled
    icon: mdi:bell-outline

  zendure_prompt_approved_today:
    name: Zendure - Prompt Approved Today
    icon: mdi:check-circle-outline

  zendure_ignore_low_solar_forecast:
    name: Zendure - Ignore Low Solar Forecast Today
    icon: mdi:weather-sunny-alert

template:
  - trigger:
      - platform: time_pattern
        minutes: 1
      - platform: state
        entity_id:
          - input_boolean.zendure_export_armed
          - input_boolean.zendure_vacation_mode
          - input_number.zendure_aircon_temp_threshold
          - input_text.zendure_bedroom1_temp_sensor
          - input_text.zendure_bedroom2_temp_sensor
          - input_text.zendure_bedroom3_temp_sensor
          - input_text.zendure_bedroom1_airco
          - input_text.zendure_bedroom2_airco
          - input_text.zendure_bedroom3_airco
    binary_sensor:
      - name: "Zendure Aircon Reserve Needed"
        icon: mdi:snowflake-alert
        device_class: problem
        state: >
          {% set away = is_state('input_boolean.zendure_export_armed', 'on')
                        or is_state('input_boolean.zendure_vacation_mode', 'on') %}
          {% set threshold = states('input_number.zendure_aircon_temp_threshold') | float(25) %}
          {% set t1 = states('input_text.zendure_bedroom1_temp_sensor') %}
          {% set t2 = states('input_text.zendure_bedroom2_temp_sensor') %}
          {% set t3 = states('input_text.zendure_bedroom3_temp_sensor') %}
          {% set a1 = states('input_text.zendure_bedroom1_airco') %}
          {% set a2 = states('input_text.zendure_bedroom2_airco') %}
          {% set a3 = states('input_text.zendure_bedroom3_airco') %}
          {% set airco_active = (a1 != '' and is_state(a1, 'cool'))
             or (a2 != '' and is_state(a2, 'cool'))
             or (a3 != '' and is_state(a3, 'cool')) %}
          {% set temp_high = (t1 != '' and states(t1) | float(0) > threshold)
             or (t2 != '' and states(t2) | float(0) > threshold)
             or (t3 != '' and states(t3) | float(0) > threshold) %}
          {{ airco_active or (temp_high and not away) }}
    sensor:
      - name: "Zendure Bedroom 1 Temp Value"
        icon: mdi:thermometer
        state: >
          {% set e = states('input_text.zendure_bedroom1_temp_sensor') %}
          {{ states(e) if e not in ['', 'unknown', 'unavailable'] else 'not set' }}
      - name: "Zendure Bedroom 2 Temp Value"
        icon: mdi:thermometer
        state: >
          {% set e = states('input_text.zendure_bedroom2_temp_sensor') %}
          {{ states(e) if e not in ['', 'unknown', 'unavailable'] else 'not set' }}
      - name: "Zendure Bedroom 3 Temp Value"
        icon: mdi:thermometer
        state: >
          {% set e = states('input_text.zendure_bedroom3_temp_sensor') %}
          {{ states(e) if e not in ['', 'unknown', 'unavailable'] else 'not set' }}
      - name: "Zendure Bedroom 1 Airco State"
        icon: mdi:air-conditioner
        state: >
          {% set e = states('input_text.zendure_bedroom1_airco') %}
          {{ states(e) if e not in ['', 'unknown', 'unavailable'] else 'not set' }}
      - name: "Zendure Bedroom 2 Airco State"
        icon: mdi:air-conditioner
        state: >
          {% set e = states('input_text.zendure_bedroom2_airco') %}
          {{ states(e) if e not in ['', 'unknown', 'unavailable'] else 'not set' }}
      - name: "Zendure Bedroom 3 Airco State"
        icon: mdi:air-conditioner
        state: >
          {% set e = states('input_text.zendure_bedroom3_airco') %}
          {{ states(e) if e not in ['', 'unknown', 'unavailable'] else 'not set' }}

  - binary_sensor:
      - name: "Zendure Low Solar Tomorrow"
        icon: mdi:weather-cloudy-alert
        device_class: problem
        state: >
          {% set forecast = states('sensor.zendure_solar_forecast_tomorrow') | float(0) %}
          {% set threshold = states('input_number.zendure_low_solar_threshold_kwh') | float(5) %}
          {{ forecast < threshold }}

      - name: "Zendure Export Active"
        icon: mdi:transmission-tower-export
        device_class: running
        state: >
          {% set armed = is_state('input_boolean.zendure_export_armed', 'on') %}
          {% set aircon_block = is_state('binary_sensor.zendure_aircon_reserve_needed', 'on') %}
          {% set low_solar_block = is_state('binary_sensor.zendure_low_solar_tomorrow', 'on')
                                    and not is_state('input_boolean.zendure_ignore_low_solar_forecast', 'on') %}
          {% set mode_ok = states('input_select.zendure_operation_mode') == 'Quick Discharge' %}
          {% set soc_ok = states('sensor.zendure_true_total_state_of_charge') | float(0) >
                          states('input_number.zendure_night_reserve_soc') | float(0) %}
          {% set peak_hour = is_state('sensor.dynamic_highest_price_period', 'Yes') %}
          {{ armed and not aircon_block and not low_solar_block and mode_ok and soc_ok and peak_hour }}

  - sensor:
      - name: "Zendure Solar Forecast Tomorrow"
        icon: mdi:solar-power-variant
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {# Sums Forecast.Solar's per-plane tomorrow estimate across all 3
             real solar systems (Huawei south, SolaX X1 east, SolaX X2 west).
             Update the entity IDs below if your Forecast.Solar instances
             change. #}
          {% set huawei = states('sensor.energy_production_tomorrow') | float(0) %}
          {% set x1 = states('sensor.energy_production_tomorrow_2') | float(0) %}
          {% set x2 = states('sensor.energy_production_tomorrow_3') | float(0) %}
          {{ (huawei + x1 + x2) | round(2) }}

      - name: "Zendure Export Reason"
        icon: mdi:information-outline
        state: >
          {% set armed = is_state('input_boolean.zendure_export_armed', 'on') %}
          {% set vacation = is_state('input_boolean.zendure_vacation_mode', 'on') %}
          {% set prompt_approved = is_state('input_boolean.zendure_prompt_approved_today', 'on') %}
          {% set aircon_block = is_state('binary_sensor.zendure_aircon_reserve_needed', 'on') %}
          {% set low_solar_block = is_state('binary_sensor.zendure_low_solar_tomorrow', 'on')
                                    and not is_state('input_boolean.zendure_ignore_low_solar_forecast', 'on') %}
          {% set custom_time = states('input_text.zendure_custom_not_before_time_today') %}
          {% set has_custom = custom_time not in ['', 'unknown', 'unavailable'] %}
          {% if has_custom %}
            {% set not_waiting = now() >= today_at(custom_time) %}
            {% set not_before_display = custom_time %}
          {% else %}
            {% set not_before_hour = states('input_number.zendure_export_not_before_hour') | int(20) %}
            {% set not_waiting = now().hour >= not_before_hour %}
            {% set not_before_display = '%02d:00' | format(not_before_hour) %}
          {% endif %}
          {% set mode_ok = states('input_select.zendure_operation_mode') == 'Quick Discharge' %}
          {% set soc = states('sensor.zendure_true_total_state_of_charge') | float(0) %}
          {% set reserve = states('input_number.zendure_night_reserve_soc') | float(0) %}
          {% set peak_hour = is_state('sensor.dynamic_highest_price_period', 'Yes') %}

          {% if not armed %}
            Not armed — export switch is off
          {% elif aircon_block %}
            Blocked — an airco is cooling, or a room is too hot while you're home
          {% elif low_solar_block %}
            Blocked — tomorrow's solar forecast ({{ states('sensor.zendure_solar_forecast_tomorrow') }} kWh) is below threshold
          {% elif soc <= reserve %}
            Blocked — battery at {{ soc }}%, at/below reserve floor of {{ reserve }}%
          {% elif not vacation and not prompt_approved and not not_waiting %}
            Waiting — armed, but export won't start before {{ not_before_display }}
          {% elif not peak_hour %}
            Armed and ready — waiting for a top price hour to begin
          {% elif not mode_ok %}
            Switching — conditions met, waiting for mode to switch to Quick Discharge
          {% else %}
            Exporting now — current hour is a top price period, SOC {{ soc }}% above reserve {{ reserve }}%
          {% endif %}

      - name: "Zendure Current Mode"
        icon: mdi:battery-sync-outline
        state: "{{ states('input_select.zendure_operation_mode') }}"

      - name: "Zendure Prompt Approved Today Status"
        icon: mdi:check-circle-outline
        state: "{{ states('input_boolean.zendure_prompt_approved_today') }}"

      - name: "Zendure Next Mode Flip"
        icon: mdi:swap-horizontal-circle-outline
        state: >
          {% set armed = is_state('input_boolean.zendure_export_armed', 'on') %}
          {% set vacation = is_state('input_boolean.zendure_vacation_mode', 'on') %}
          {% set aircon_block = is_state('binary_sensor.zendure_aircon_reserve_needed', 'on') %}
          {% set low_solar_block = is_state('binary_sensor.zendure_low_solar_tomorrow', 'on')
                                    and not is_state('input_boolean.zendure_ignore_low_solar_forecast', 'on') %}
          {% set current_mode = states('input_select.zendure_operation_mode') %}
          {% set target_mode = 'Quick Discharge' %}
          {% set revert_mode = states('input_select.zendure_revert_mode') %}
          {% set custom_time = states('input_text.zendure_custom_not_before_time_today') %}
          {% set has_custom = custom_time not in ['', 'unknown', 'unavailable'] %}
          {% if has_custom %}
            {% set not_waiting = now() >= today_at(custom_time) %}
            {% set not_before_display = custom_time %}
          {% else %}
            {% set not_before_hour = states('input_number.zendure_export_not_before_hour') | int(20) %}
            {% set not_waiting = now().hour >= not_before_hour %}
            {% set not_before_display = '%02d:00' | format(not_before_hour) %}
          {% endif %}
          {% set prompt_approved = is_state('input_boolean.zendure_prompt_approved_today', 'on') %}
          {% set nu = now() %}
          {% set data = state_attr('sensor.dynamic_highest_price_period', 'raw_today') %}
          {% if not armed %}
            Not armed — no flip scheduled
          {% elif aircon_block %}
            Blocked by aircon — resumes when clear
          {% elif low_solar_block %}
            Blocked by low solar forecast — resumes when clear or overridden
          {% elif current_mode == target_mode %}
            {% if data %}
              {% set toekomst = data
                | selectattr('duur', 'eq', 'Yes')
                | selectattr('end', '>', nu.isoformat())
                | sort(attribute='start')
                | list %}
              {% if toekomst | length > 0 %}
                {% set ns = namespace(eind = toekomst[0].end, broken = false) %}
                {% for i in range(1, toekomst | length) %}
                  {% if not ns.broken %}
                    {% if toekomst[i].start == ns.eind %}
                      {% set ns.eind = toekomst[i].end %}
                    {% else %}
                      {% set ns.broken = true %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {% set eind_dt = ns.eind | as_datetime | as_local %}
                {{ eind_dt.strftime('%H:%M') }} → {{ revert_mode }}
              {% else %}
                Soon → {{ revert_mode }}
              {% endif %}
            {% else %}
              Unknown
            {% endif %}
          {% else %}
            {% if not vacation and not prompt_approved and not not_waiting %}
              {{ not_before_display }} → {{ target_mode }} (once a peak hour begins)
            {% else %}
              {{ states('sensor.zendure_next_export_window') }} → {{ target_mode }}
            {% endif %}
          {% endif %}

      - name: "Zendure Next Export Window"
        icon: mdi:clock-start
        state: >
          {% set data = state_attr('sensor.dynamic_highest_price_period', 'raw_today') %}
          {% set nu = now() %}
          {% if data %}
            {% set toekomst = data
              | selectattr('duur', 'eq', 'Yes')
              | selectattr('end', '>', nu.isoformat())
              | sort(attribute='start')
              | list %}
            {% if toekomst | length > 0 %}
              {% set start_dt = toekomst[0].start | as_datetime | as_local %}
              {% set ns = namespace(eind = toekomst[0].end, broken = false) %}
              {% for i in range(1, toekomst | length) %}
                {% if not ns.broken %}
                  {% if toekomst[i].start == ns.eind %}
                    {% set ns.eind = toekomst[i].end %}
                  {% else %}
                    {% set ns.broken = true %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {% set eind_dt = ns.eind | as_datetime | as_local %}
              {% if start_dt <= nu %}
                Active now — until {{ eind_dt.strftime('%H:%M') }}
              {% else %}
                {{ start_dt.strftime('%H:%M') }} - {{ eind_dt.strftime('%H:%M') }}
              {% endif %}
            {% else %}
              None remaining today
            {% endif %}
          {% else %}
            Unavailable
          {% endif %}

      - name: "Zendure All Remaining Windows Today"
        icon: mdi:clock-time-eight-outline
        state: >
          {% set data = state_attr('sensor.dynamic_highest_price_period', 'raw_today') %}
          {% set nu = now() %}
          {% if data %}
            {% set toekomst = data
              | selectattr('duur', 'eq', 'Yes')
              | selectattr('end', '>', nu.isoformat())
              | sort(attribute='start')
              | list %}
            {% if toekomst | length > 0 %}
              {% set ns = namespace(windows=[], cur_start=toekomst[0].start, cur_end=toekomst[0].end) %}
              {% for i in range(1, toekomst | length) %}
                {% if toekomst[i].start == ns.cur_end %}
                  {% set ns.cur_end = toekomst[i].end %}
                {% else %}
                  {% set ns.windows = ns.windows + [[ns.cur_start, ns.cur_end]] %}
                  {% set ns.cur_start = toekomst[i].start %}
                  {% set ns.cur_end = toekomst[i].end %}
                {% endif %}
              {% endfor %}
              {% set ns.windows = ns.windows + [[ns.cur_start, ns.cur_end]] %}
              {% set ns2 = namespace(parts=[]) %}
              {% for w in ns.windows %}
                {% set s = w[0] | as_datetime | as_local %}
                {% set e = w[1] | as_datetime | as_local %}
                {% set ns2.parts = ns2.parts + [s.strftime('%H:%M') ~ '-' ~ e.strftime('%H:%M')] %}
              {% endfor %}
              {{ ns2.parts | join(', ') }}
            {% else %}
              None remaining today
            {% endif %}
          {% else %}
            Unavailable
          {% endif %}
        attributes:
          window_count: >
            {% set data = state_attr('sensor.dynamic_highest_price_period', 'raw_today') %}
            {% set nu = now() %}
            {% if data %}
              {% set toekomst = data
                | selectattr('duur', 'eq', 'Yes')
                | selectattr('end', '>', nu.isoformat())
                | sort(attribute='start')
                | list %}
              {% if toekomst | length > 0 %}
                {% set ns = namespace(count=1, cur_end=toekomst[0].end) %}
                {% for i in range(1, toekomst | length) %}
                  {% if toekomst[i].start != ns.cur_end %}
                    {% set ns.count = ns.count + 1 %}
                  {% endif %}
                  {% set ns.cur_end = toekomst[i].end %}
                {% endfor %}
                {{ ns.count }}
              {% else %}
                0
              {% endif %}
            {% else %}
              0
            {% endif %}

      - name: "Zendure Package Version"
        icon: mdi:tag-outline
        state: "2.12.0"

      - name: "Zendure True Total State Of Charge"
        icon: mdi:battery-sync-outline
        unique_id: zendure_true_total_state_of_charge
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        state: >
          {# Gielz1986's sensor.zendure_total_state_of_charge is a naive
             average of electricLevel across proxy units — not weighted by
             capacity. With asymmetric units (5.28 kWh vs 2.4 kWh) that's
             wrong. This sensor computes the correct capacity-weighted SOC
             from the two individual proxy unit sensors. Capacities are
             hardcoded below — update if hardware changes. #}
          {% set soc1 = states('sensor.zendure_1_state_of_charge') | float(none) %}
          {% set soc2 = states('sensor.zendure_2_state_of_charge') | float(none) %}
          {% set cap1 = 5.28 %}
          {% set cap2 = 2.4 %}
          {% if soc1 is none or soc2 is none %}
            {{ states('sensor.zendure_total_state_of_charge') }}
          {% else %}
            {{ ((soc1 * cap1 + soc2 * cap2) / (cap1 + cap2)) | round(1) }}
          {% endif %}

      - name: "Zendure Estimated Reserve Reached"
        icon: mdi:battery-clock-outline
        state: >
          {% set soc = states('sensor.zendure_true_total_state_of_charge') | float(0) %}
          {% set reserve = states('input_number.zendure_night_reserve_soc') | float(0) %}
          {% set capacity = states('sensor.zendure_total_capacity') | float(0) %}
          {% set max_power = states('input_number.zendure_setting_max_discharge_power') | float(0) %}
          {% set data = state_attr('sensor.dynamic_highest_price_period', 'raw_today') %}
          {% set nu = now() %}
          {% if soc <= reserve %}
            Already at or below reserve
          {% elif max_power <= 0 or capacity <= 0 %}
            Unknown — missing power/capacity data
          {% elif not data %}
            Unknown — no price data
          {% else %}
            {% set actief = data
              | selectattr('duur', 'eq', 'Yes')
              | selectattr('end', '>', nu.isoformat())
              | list %}
            {% if actief | length == 0 %}
              No export window remaining today
            {% else %}
              {% set volgende = actief | sort(attribute='start') | first %}
              {% set start_dt = volgende.start | as_datetime | as_local %}
              {% set base_start = nu if start_dt <= nu else start_dt %}
              {% set energy_kwh = (soc - reserve) / 100 * capacity %}
              {% set hours = energy_kwh / (max_power / 1000) %}
              {% set eta = base_start + timedelta(hours=hours) %}
              {{ eta.strftime('%H:%M') if eta.date() == nu.date() else eta.strftime('%a %H:%M') }}
            {% endif %}
          {% endif %}
        attributes:
          hours_remaining_at_max_power: >
            {% set soc = states('sensor.zendure_true_total_state_of_charge') | float(0) %}
            {% set reserve = states('input_number.zendure_night_reserve_soc') | float(0) %}
            {% set capacity = states('sensor.zendure_total_capacity') | float(0) %}
            {% set max_power = states('input_number.zendure_setting_max_discharge_power') | float(0) %}
            {% if soc <= reserve or max_power <= 0 or capacity <= 0 %}
              0
            {% else %}
              {{ (((soc - reserve) / 100 * capacity) / (max_power / 1000)) | round(2) }}
            {% endif %}

script:
  zendure_send_notification:
    alias: Zendure - Send Notification
    fields:
      title:
        default: "Zendure"
      message:
        default: ""
      tag:
        default: "zendure_notification"
      actions:
        default: []
    sequence:
      - if:
          - condition: state
            entity_id: input_boolean.zendure_notifications_enabled
            state: "on"
        then:
          - repeat:
              for_each:
                - "{{ states('input_text.zendure_notify_phone1') }}"
                - "{{ states('input_text.zendure_notify_phone2') }}"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ repeat.item not in ['', 'unknown', 'unavailable'] }}"
                  then:
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ actions | length > 0 }}"
                          sequence:
                            - service: "{{ repeat.item }}"
                              data:
                                title: "{{ title }}"
                                message: "{{ message }}"
                                data:
                                  tag: "{{ tag }}"
                                  actions: "{{ actions }}"
                      default:
                        - service: "{{ repeat.item }}"
                          data:
                            title: "{{ title }}"
                            message: "{{ message }}"
                            data:
                              tag: "{{ tag }}"

  zendure_send_test_notification:
    alias: Zendure - Send Test Notification
    sequence:
      - service: script.zendure_send_notification
        data:
          title: "Zendure - Test Notification"
          message: >-
            This is a test. If you see this, notifications are working. Sent at
            {{ now().strftime('%H:%M:%S') }}.
          tag: "zendure_test_notification"

  zendure_force_stop_export:
    alias: Zendure - Force Stop Export Now
    description: >-
      Manual emergency stop: immediately disarms export, reverts mode to the
      chosen Revert To Mode, and resets the SOC floor to normal — regardless
      of current price flag, aircon state, or any other condition.
    sequence:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.zendure_export_armed
      - service: input_select.select_option
        target:
          entity_id: input_select.zendure_operation_mode
        data:
          option: "{{ states('input_select.zendure_revert_mode') }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.zendure_setting_minimum_allowed_state_of_charge
        data:
          value: 10
      - service: script.zendure_send_notification
        data:
          title: "Zendure - Export Force Stopped"
          message: "Export manually stopped. Mode reverted, armed disabled."
          tag: "zendure_export_status"

sensor:
  - platform: history_stats
    name: Zendure Export Time Today
    entity_id: binary_sensor.zendure_export_active
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Zendure Export Count Today
    entity_id: binary_sensor.zendure_export_active
    state: "on"
    type: count
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

automation:
  - id: zendure_armed_price_export_control
    alias: Zendure - Armed price-based export control
    description: >-
      Directly controls Quick Discharge based on Gielz1986's own price-ranking
      flag (sensor.dynamic_highest_price_period) instead of delegating to his
      Dynamic Trading mode branch. Entry requires: armed, no aircon block, no
      low-solar-tomorrow block, past the configured start hour (unless on
      vacation), above reserve, and the current hour flagged as a top price
      period. Reverts to the fixed "Revert To Mode" the moment any of those
      stop being true.
    trigger:
      - platform: state
        entity_id: input_boolean.zendure_export_armed
      - platform: state
        entity_id: binary_sensor.zendure_aircon_reserve_needed
      - platform: state
        entity_id: binary_sensor.zendure_low_solar_tomorrow
      - platform: state
        entity_id: input_boolean.zendure_ignore_low_solar_forecast
      - platform: state
        entity_id: sensor.dynamic_highest_price_period
      - platform: time_pattern
        minutes: 5
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.zendure_export_armed
                state: "on"
              - condition: state
                entity_id: binary_sensor.zendure_aircon_reserve_needed
                state: "off"
              - condition: template
                value_template: >-
                  {{ not is_state('binary_sensor.zendure_low_solar_tomorrow', 'on')
                     or is_state('input_boolean.zendure_ignore_low_solar_forecast', 'on') }}
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.zendure_vacation_mode', 'on')
                     or is_state('input_boolean.zendure_prompt_approved_today', 'on')
                     or (states('input_text.zendure_custom_not_before_time_today') not in ['', 'unknown', 'unavailable']
                         and now() >= today_at(states('input_text.zendure_custom_not_before_time_today')))
                     or (states('input_text.zendure_custom_not_before_time_today') in ['', 'unknown', 'unavailable']
                         and now().hour >= (states('input_number.zendure_export_not_before_hour') | int(20))) }}
              - condition: template
                value_template: >-
                  {{ states('sensor.zendure_true_total_state_of_charge') | float(0) >
                     states('input_number.zendure_night_reserve_soc') | float(0) }}
              - condition: state
                entity_id: sensor.dynamic_highest_price_period
                state: "Yes"
              - condition: template
                value_template: "{{ states('input_select.zendure_operation_mode') != 'Quick Discharge' }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.zendure_setting_minimum_allowed_state_of_charge
                data:
                  value: >-
                    {{ [states('input_number.zendure_night_reserve_soc') | float, 50] | min }}
              - service: input_select.select_option
                target:
                  entity_id: input_select.zendure_operation_mode
                data:
                  option: "Quick Discharge"
        default:
          - condition: template
            value_template: >-
              {{ states('input_select.zendure_operation_mode') == 'Quick Discharge'
                 and (
                   not is_state('input_boolean.zendure_export_armed', 'on')
                   or is_state('binary_sensor.zendure_aircon_reserve_needed', 'on')
                   or (
                     is_state('binary_sensor.zendure_low_solar_tomorrow', 'on')
                     and not is_state('input_boolean.zendure_ignore_low_solar_forecast', 'on')
                   )
                   or (
                     not is_state('input_boolean.zendure_vacation_mode', 'on')
                     and not is_state('input_boolean.zendure_prompt_approved_today', 'on')
                     and (
                       (states('input_text.zendure_custom_not_before_time_today') not in ['', 'unknown', 'unavailable']
                        and now() < today_at(states('input_text.zendure_custom_not_before_time_today')))
                       or (states('input_text.zendure_custom_not_before_time_today') in ['', 'unknown', 'unavailable']
                           and now().hour < (states('input_number.zendure_export_not_before_hour') | int(20)))
                     )
                   )
                   or states('sensor.zendure_true_total_state_of_charge') | float(0) <=
                      states('input_number.zendure_night_reserve_soc') | float(0)
                   or not is_state('sensor.dynamic_highest_price_period', 'Yes')
                 ) }}
          - service: input_select.select_option
            target:
              entity_id: input_select.zendure_operation_mode
            data:
              option: "{{ states('input_select.zendure_revert_mode') }}"
          - service: input_number.set_value
            target:
              entity_id: input_number.zendure_setting_minimum_allowed_state_of_charge
            data:
              value: 10
    mode: single

  - id: zendure_auto_disarm_daily_export_at_reserve
    alias: Zendure - Auto disarm daily export at reserve
    description: >-
      Once a daily armed session hits reserve SOC, disarm and force-revert
      mode/floor unconditionally — regardless of what mode is currently
      active (even if manually overridden) — since reaching reserve is a
      hard safety line. Skipped entirely while on vacation, where staying
      armed across multiple days is intentional.
    trigger:
      - platform: template
        value_template: >-
          {{ states('sensor.zendure_true_total_state_of_charge') | float(100) <=
             states('input_number.zendure_night_reserve_soc') | float(0) }}
    condition:
      - condition: state
        entity_id: input_boolean.zendure_export_armed
        state: "on"
      - condition: state
        entity_id: input_boolean.zendure_vacation_mode
        state: "off"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.zendure_export_armed
      - service: input_select.select_option
        target:
          entity_id: input_select.zendure_operation_mode
        data:
          option: "{{ states('input_select.zendure_revert_mode') }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.zendure_setting_minimum_allowed_state_of_charge
        data:
          value: 10
    mode: single

  - id: zendure_vacation_mode_auto_arm
    alias: Zendure - Vacation mode auto-arm
    description: >-
      Vacation mode simply arms/disarms export automatically, so you don't
      have to remember to flip the switch daily while away.
    trigger:
      - platform: state
        entity_id: input_boolean.zendure_vacation_mode
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.zendure_vacation_mode
                state: "on"
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.zendure_export_armed
        default:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.zendure_export_armed
    mode: single

  - id: zendure_notify_export_active_inactive
    alias: Zendure - Notify export active/inactive
    description: >-
      Sends a phone notification the moment export actually starts (Quick
      Discharge active) and again the moment it stops.
    trigger:
      - platform: state
        entity_id: binary_sensor.zendure_export_active
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.zendure_export_active
                state: "on"
            sequence:
              - service: script.zendure_send_notification
                data:
                  title: "Zendure - Export started"
                  message: >-
                    Discharging to the grid now. SOC {{ states('sensor.zendure_true_total_state_of_charge') }}%,
                    reserve floor {{ states('input_number.zendure_night_reserve_soc') }}%.
                  tag: "zendure_export_status"
        default:
          - service: script.zendure_send_notification
            data:
              title: "Zendure - Export stopped"
              message: >-
                No longer exporting. Mode is now "{{ states('sensor.zendure_current_mode') }}",
                SOC {{ states('sensor.zendure_true_total_state_of_charge') }}%.
              tag: "zendure_export_status"
    mode: single

  - id: zendure_ask_to_arm_export_if_not_set
    alias: Zendure - Ask to arm export if not set
    description: >-
      Each evening at the configured reminder time (hour + minute), if export
      hasn't been armed manually and you're not on vacation (where arming is
      automatic), asks whether to arm it tonight.
    trigger:
      - platform: time
        at: input_datetime.zendure_export_reminder_time
    condition:
      - condition: state
        entity_id: input_boolean.zendure_export_armed
        state: "off"
      - condition: state
        entity_id: input_boolean.zendure_vacation_mode
        state: "off"
    action:
      - service: script.zendure_send_notification
        data:
          title: "Zendure - Enable export tonight?"
          message: >-
            Export isn't armed yet. Next price window: {{ states('sensor.zendure_next_export_window') }}.
          tag: "zendure_arm_prompt"
          actions:
            - action: "ZENDURE_ARM_YES"
              title: "✅ Arm export"
            - action: "ZENDURE_ARM_NO"
              title: "❌ Not today"
            - action: "ZENDURE_SET_LATER_TIME"
              title: "🕒 Set later time"
              behavior: "textInput"
              textInputButtonTitle: "Set"
              textInputPlaceholder: "HH:MM, e.g. 21:30"
    mode: single

  - id: zendure_handle_arm_prompt_response
    alias: Zendure - Handle arm prompt response
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "ZENDURE_ARM_YES"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.zendure_export_armed
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.zendure_prompt_approved_today
      - service: script.zendure_send_notification
        data:
          message: "Export armed for tonight."
          tag: "zendure_arm_prompt"
    mode: single

  - id: zendure_handle_set_later_time_response
    alias: Zendure - Handle set later time response
    description: >-
      Handles the "Set later time" text reply on the arm prompt. Validates
      HH:MM format, stores it as today's one-time override (bypassing the
      normal Don't Export Before Hour setting for tonight only), and arms
      export. Sends an error notification if the entered text isn't a valid
      time.
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "ZENDURE_SET_LATER_TIME"
    action:
      - variables:
          reply: "{{ trigger.event.data.reply_text | default('') | trim }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ reply | regex_match('^([01]?[0-9]|2[0-3]):[0-5][0-9]$') }}"
            sequence:
              - service: input_text.set_value
                target:
                  entity_id: input_text.zendure_custom_not_before_time_today
                data:
                  value: "{{ reply }}"
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.zendure_export_armed
              - service: script.zendure_send_notification
                data:
                  title: "Zendure - Export scheduled"
                  message: "Export will be allowed to start from {{ reply }} tonight."
                  tag: "zendure_arm_prompt"
        default:
          - service: script.zendure_send_notification
            data:
              title: "Zendure - Invalid time"
              message: >-
                Couldn't understand "{{ reply }}". Please use HH:MM format (e.g. 21:30).
              tag: "zendure_arm_prompt"
    mode: single

  - id: zendure_reset_custom_not_before_time
    alias: Zendure - Reset custom not-before time
    description: >-
      Clears today's one-time custom export start time at midnight, so
      tomorrow falls back to the normal Don't Export Before Hour setting.
    trigger:
      - platform: time
        at: "00:00:00"
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.zendure_custom_not_before_time_today
        data:
          value: ""
    mode: single

  - id: zendure_reset_prompt_approved_flag
    alias: Zendure - Reset prompt approved flag
    trigger:
      - platform: time
        at: "00:00:00"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.zendure_prompt_approved_today
    mode: single
