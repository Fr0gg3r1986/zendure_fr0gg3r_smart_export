# =============================================================================
# Zendure Smart Export — Dashboard
# Author: Fr0gg3r1986
# https://github.com/Fr0gg3r1986/zendure-smart-export
# Companion dashboard for zendure_smart_export.yaml. Requires Gielz1986's
# base integration (https://github.com/Gielz1986/Zendure-HA-zenSDK) and,
# for multi-unit setups, gast777's proxy
# (https://github.com/gast777/Zendure-zenSDK-proxy).
#
# Changelog:
#   2.13.1
#     - Added "Package vX.X.X · Dashboard vX.X.X · by Fr0gg3r1986" footer
#       to the bottom of the Live view, matching the existing footer on
#       Custom Export.
#     - Dashboard renamed from "dashboard-zendure-export-maarten" to
#       "Zendure Smart Export" ahead of publishing publicly; added author
#       credit. No functional changes from this rename.
#   2.13.0
#     - Added a new glance card under Home Energy on the Live view showing
#       per-unit detail: Unit 1 SOC, Unit 1 Power, Unit 2 SOC, Unit 2 Power
#       (from the proxy's individual-unit sensors).
#   2.12.0
#     - All 6 combined-SOC displays (Live glance card, Custom Export history
#       graph + gauge, Geschiedenis history graphs x3) repointed from the
#       raw sensor.zendure_total_state_of_charge to the corrected
#       sensor.zendure_true_total_state_of_charge. "SOC %" label on Live
#       relabeled to "Real SOC %".
#   2.11.0
#     - Added the "Proxy Details" view: gast777 proxy sensors (per-unit
#       power/SOC/mode/serial, active device, offgrid outlets), proxy
#       control switches (no-sleep, all-active, equal-mode, dual damper),
#       and per-battery-pack temperature/SOC/cell-balance rows (supports up
#       to 18 packs, each row conditionally hidden if unavailable).
#   2.10.1
#     - Prior baseline predating this changelog.
# =============================================================================
