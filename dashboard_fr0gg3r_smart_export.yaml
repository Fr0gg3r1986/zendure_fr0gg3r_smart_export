      - type: grid
        cards:
          - type: heading
            heading: Daily Settings
            heading_style: title
            icon: mdi:tune
          - type: markdown
            content: >-
              <ha-alert alert-type="warning">Gielz1986's hardware SOC floor caps
              at 50%. Setting Reserve SOC above 50% is still fully protected —
              just by our own automation watching live SOC, not the battery's
              own hardware floor above that point.</ha-alert>
            text_only: true
          - type: entities
            entities:
              - entity: input_number.zendure_night_reserve_soc
                name: Reserve SOC
              - entity: input_number.zendure_export_not_before_hour
                name: Don't Export Before Hour
              - entity: input_datetime.zendure_export_reminder_time
                name: Arm Reminder Time
              - entity: input_select.zendure_revert_mode
                name: Revert To Mode
              - entity: input_select.zendure_operation_mode
                name: Operation Mode (editable)
      - type: grid
        cards:
          - type: heading
            heading: Notifications
            heading_style: title
            icon: mdi:bell-outline
          - type: entities
            entities:
              - entity: input_boolean.zendure_notifications_enabled
                name: Notifications Enabled
              - entity: input_text.zendure_notify_phone1
                name: Notify Phone 1
              - entity: input_text.zendure_notify_phone2
                name: Notify Phone 2
          - type: button
            name: Send Test Notification
            icon: mdi:bell-check-outline
            tap_action:
              action: perform-action
              perform_action: script.zendure_send_test_notification
              data: {}
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Enter the full notify service name for
              each phone (e.g. notify.mobile_app_johns_iphone) — find it under
              Developer Tools → Actions, search "notify". Leave a field blank to
              skip that phone.</ha-alert>
