# =============================================================================
# Zendure Smart Export — Dashboard
# Author: Fr0gg3r1986
# https://github.com/Fr0gg3r1986/zendure-smart-export
# Companion dashboard for zendure_smart_export.yaml. Requires Gielz1986's
# base integration (https://github.com/Gielz1986/Zendure-HA-zenSDK) and,
# for multi-unit setups, gast777's proxy
# (https://github.com/gast777/Zendure-zenSDK-proxy).
#
# Changelog:
#   2.15.0
#     - Added a Forecast section to the Solar view: combined + per-plane
#       today/this-hour/remaining-today figures, peak production times, and
#       a clearly flagged display of the unmatched 4th Forecast.Solar device
#       (appears to be an empty/misconfigured entry — not used in any totals).
#     - Added "Low Solar Blocking" tile to Export Control, and a new "Solar
#       Reserve Settings" section on Export Settings: combined tomorrow
#       forecast, threshold, live block status, per-day override toggle.
#       Companion to package v2.12.0's low-solar-tomorrow export block.
#     - Removed two leftover empty artifacts (a stray "New section" heading
#       on Export Control, an empty trailing grid on Export Settings).
# Changelog:
#   2.15.0
#     - Added a Forecast section to the Solar view: combined + per-plane
#       today/this-hour/remaining-today figures, peak production times, and
#       a clearly flagged display of the unmatched 4th Forecast.Solar device
#       (appears to be an empty/misconfigured entry — not used in any totals).
#     - Added "Low Solar Blocking" tile to Export Control, and a new "Solar
#       Reserve Settings" section on Export Settings: combined tomorrow
#       forecast, threshold, live block status, per-day override toggle.
#       Companion to package v2.12.0's low-solar-tomorrow export block.
#     - Removed two leftover empty artifacts (a stray "New section" heading
#       on Export Control, an empty trailing grid on Export Settings).
#   2.13.1
#     - Added "Package vX.X.X · Dashboard vX.X.X · by Fr0gg3r1986" footer
#       to the bottom of the Live view, matching the existing footer on
#       Custom Export.
#     - Dashboard renamed from "dashboard-zendure-export-maarten" to
#       "Zendure Smart Export" ahead of publishing publicly; added author
#       credit. No functional changes from this rename.
#   2.13.0
#     - Added a new glance card under Home Energy on the Live view showing
#       per-unit detail: Unit 1 SOC, Unit 1 Power, Unit 2 SOC, Unit 2 Power
#       (from the proxy's individual-unit sensors).
#   2.12.0
#     - All 6 combined-SOC displays (Live glance card, Custom Export history
#       graph + gauge, Geschiedenis history graphs x3) repointed from the
#       raw sensor.zendure_total_state_of_charge to the corrected
#       sensor.zendure_true_total_state_of_charge. "SOC %" label on Live
#       relabeled to "Real SOC %".
#   2.11.0
#     - Added the "Proxy Details" view: gast777 proxy sensors (per-unit
#       power/SOC/mode/serial, active device, offgrid outlets), proxy
#       control switches (no-sleep, all-active, equal-mode, dual damper),
#       and per-battery-pack temperature/SOC/cell-balance rows (supports up
#       to 18 packs, each row conditionally hidden if unavailable).
#   2.10.1
#     - Prior baseline predating this changelog.
# =============================================================================
views:
  - type: sections
    max_columns: 3
    title: Overview
    path: overview
    icon: mdi:lightning-bolt
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Home Energy
            heading_style: title
            icon: mdi:home-lightning-bolt
          - type: glance
            show_name: true
            show_icon: true
            show_state: true
            entities:
              - entity: sensor.p1_meter_5c2faf0f7b00_active_power
                name: Grid (P1)
                icon: mdi:transmission-tower
              - entity: sensor.solar_power_ac_now
                name: Solar
                icon: mdi:solar-power-variant
              - entity: sensor.zendure_offgrid_socket_power
                show_state: true
                show_last_changed: false
                name: Offgrid
              - entity: sensor.solar_used_now
                name: Home Use
                icon: mdi:home-lightning-bolt-outline
              - entity: sensor.zendure_true_total_state_of_charge
                name: Real SOC %
                icon: mdi:battery-medium
          - type: glance
            show_name: true
            show_icon: true
            show_state: true
            entities:
              - entity: sensor.zendure_charging_mode
                name: Mode
              - entity: sensor.zendure_indication_remaining_discharge_time
                name: Time Left
                icon: mdi:clock-time-eight-outline
              - entity: sensor.zendure_power_export
                name: Discharge
                icon: mdi:battery-minus-outline
              - entity: sensor.zendure_power_import
                name: Charge
                icon: mdi:battery-plus-outline
              - entity: sensor.zendure_wifi_signal_strength
                name: WiFi
                icon: mdi:wifi
          - type: glance
            show_name: true
            show_icon: true
            show_state: true
            entities:
              - entity: sensor.zendure_1_state_of_charge
                name: Unit 1 SOC
                icon: mdi:battery-medium
              - entity: sensor.zendure_1_power
                name: Unit 1 Power
                icon: mdi:battery-charging-medium
              - entity: sensor.zendure_2_state_of_charge
                name: Unit 2 SOC
                icon: mdi:battery-medium
              - entity: sensor.zendure_2_power
                name: Unit 2 Power
                icon: mdi:battery-charging-medium
          - type: heading
            heading: Solar Detail
            heading_style: title
            icon: mdi:solar-panel-large
          - type: distribution
            entities:
              - entity: sensor.solax_x1_power_ac_now
                name: X1 East
              - entity: sensor.solax_x2_power_ac_now
                name: X2 West
              - entity: sensor.huawei_inverter_active_power
                name: Huawei South
          - type: glance
            show_name: true
            show_icon: true
            show_state: true
            entities:
              - entity: sensor.solar_power_ac_now
                name: Total Now
              - entity: sensor.huawei_inverter_active_power
                name: Huawei (South)
              - entity: sensor.solax_x1_power_ac_now
                name: SolaX X1 (East)
              - entity: sensor.solax_x2_power_ac_now
                name: SolaX X2 (West)
          - show_name: true
            show_icon: true
            show_state: true
            type: glance
            entities:
              - entity: sensor.solax_energy_yield_today
                name: Solax Total
              - entity: sensor.inverter_daily_yield
                name: Huawei
              - entity: sensor.solax_x1_yieldtoday
                name: X1
              - entity: sensor.solax_x2_yieldtoday
                name: X2
          - type: history-graph
            title: Power Flow (4h)
            hours_to_show: 4
            entities:
              - entity: sensor.p1_meter_5c2faf0f7b00_active_power
                name: Grid (P1)
              - entity: sensor.solar_power_ac_now
                name: Solar
              - entity: sensor.zendure_power_export
                name: Battery Discharge
              - entity: sensor.zendure_power_import
                name: Battery Charge
          - type: history-graph
            title: Power Flow (30min)
            hours_to_show: 0.5
            logarithmic_scale: false
            entities:
              - entity: sensor.p1_meter_5c2faf0f7b00_active_power
                name: Grid (P1)
              - entity: sensor.solar_power_ac_now
                name: Solar
              - entity: sensor.zendure_power_export
                name: Battery Discharge
              - entity: sensor.zendure_power_import
                name: Battery Charge
              - entity: sensor.zendure_inverter_max_charge_power
              - entity: sensor.zendure_inverter_max_discharge_power
          - type: markdown
            content: >-
              Package v{{ states('sensor.zendure_package_version') }} ·
              Dashboard v2.15.0 · by Fr0gg3r1986
            text_only: true
  - type: sections
    max_columns: 2
    title: Export Control
    path: export-control
    icon: mdi:home-export-outline
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Export Control
            heading_style: title
            icon: mdi:home-export-outline
          - type: horizontal-stack
            cards:
              - type: tile
                entity: binary_sensor.zendure_export_active
                name: Exporting Now?
                vertical: false
              - type: tile
                entity: binary_sensor.zendure_aircon_reserve_needed
                name: Aircon Blocking
                vertical: false
              - type: tile
                entity: binary_sensor.zendure_low_solar_tomorrow
                name: Low Solar Blocking
                vertical: false
          - type: button
            name: Force Stop Export Now
            icon: mdi:stop-circle-outline
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.zendure_force_stop_export
              data: {}
              confirmation:
                text: Stop export now and disarm?
            grid_options:
              columns: 12
              rows: 2
          - type: entities
            entities:
              - entity: input_boolean.zendure_export_armed
                name: Allow Price-Based Export (Away)
              - entity: input_boolean.zendure_vacation_mode
                name: I'm On Vacation
              - entity: sensor.zendure_prompt_approved_today_status
                name: Approved Via Prompt Today
              - entity: input_text.zendure_custom_not_before_time_today
                name: Custom Export Start Time Tonight
              - entity: sensor.zendure_estimated_reserve_reached
                name: Reserve Reached (max power est.)
              - entity: sensor.zendure_current_mode
                name: Current Mode
              - entity: sensor.zendure_next_mode_flip
                name: Next Mode Flip
              - entity: sensor.zendure_export_reason
                name: Reason
              - entity: sensor.zendure_all_remaining_windows_today
                name: Remaining Windows Today
              - entity: sensor.zendure_export_count_today
                name: Export Sessions Today
              - entity: sensor.zendure_export_time_today
                name: Total Export Time Today
      - type: grid
        cards:
          - type: heading
            heading: Today's Energy Prices
            heading_style: title
            icon: mdi:currency-eur
          - type: custom:apexcharts-card
            header:
              show: true
              title: ''
              show_states: false
            graph_span: 24h
            span:
              start: day
            update_interval: 1min
            apex_config:
              markers:
                size: 0
                hover:
                  size: 0
              plotOptions:
                bar:
                  columnWidth: 90%
              tooltip:
                enabledOnSeries:
                  - 0
                followCursor: true
                shared: true
                intersect: false
                enabled: true
                x:
                  format: HH:mm
                  show: false
                'y':
                  formatter: |
                    EVAL: (val) => `${val.toFixed(3)} EUR/kWh`
              grid:
                show: true
                borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
                strokeDashArray: 0
                padding:
                  top: -10
              chart:
                height: 200px
                stacked: true
                stackOnlyBar: true
              yaxis:
                - title:
                    text: ''
                  decimalsInFloat: 2
                  forceNiceScale: true
                  labels:
                    style:
                      colors: >-
                        color-mix(in srgb, var(--primary-text-color) 75%,
                        transparent)
              xaxis:
                type: datetime
                labels:
                  show: true
                  datetimeUTC: false
                  format: HH:mm
                  style:
                    colors: grey
                axisTicks:
                  show: false
                axisBorder:
                  color: color-mix(in srgb, var(--divider-color) 50%, transparent)
              legend:
                show: false
            series:
              - entity: sensor.dynamic_nordpool
                name: Today
                type: column
                float_precision: 3
                color: '#e0e0e3'
                show:
                  in_header: false
                  legend_value: false
                  extremas: false
                data_generator: >
                  if (!entity || !entity.attributes) return [];

                  let data = entity.attributes.raw_today;

                  if (typeof data === 'string') {
                    try { data = JSON.parse(data); } catch (e) { return []; }
                  }

                  if (!data || !Array.isArray(data) || data.length === 0) return
                  [];

                  const aantalDuur =
                  parseInt(hass.states['input_number.dynamic_highest_price_x_period']?.state
                  || '0');

                  const aantalGoedkoop =
                  parseInt(hass.states['input_number.dynamic_lowest_price_x_period']?.state
                  || '0');

                  const sorted = [...data].sort((a, b) => a.value - b.value);

                  const goedkoopStart = aantalGoedkoop > 0 ? sorted.slice(0,
                  aantalGoedkoop).map(i => i.start) : [];

                  const duurStart = aantalDuur > 0 ?
                  sorted.slice(-aantalDuur).map(i => i.start) : [];

                  return data.map((item, index) => {
                    const tijdStart = new Date(item.start).getTime();
                    const duration = item.duration
                                      ? item.duration * 1000
                                      : (data[index + 1]
                                          ? new Date(data[index + 1].start).getTime() - tijdStart
                                          : 900000);
                    const tijdEind = tijdStart + duration;
                    const verleden = Date.now() >= tijdEind;
                    let kleur = "rgba(224,224,227,1)";
                    if (goedkoopStart.includes(item.start)) {
                      kleur = verleden ? "rgba(1,161,128,0.15)" : "rgba(1,161,128,1)";
                    } else if (duurStart.includes(item.start)) {
                      kleur = verleden ? "rgba(197,59,44,0.15)" : "rgba(197,59,44,1)";
                    } else {
                      kleur = verleden ? "rgba(162,162,163,0.15)" : "rgba(162,162,163,1)";
                    }
                    return {
                      x: tijdStart,
                      y: item.value,
                      fillColor: kleur
                    };
                  });
          - type: history-graph
            title: SOC (last 6h)
            hours_to_show: 6
            entities:
              - entity: sensor.zendure_true_total_state_of_charge
                name: SOC %
  - type: sections
    max_columns: 2
    title: Export Settings
    path: export-settings
    icon: mdi:cog-outline
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Daily Settings
            heading_style: title
            icon: mdi:tune
          - type: markdown
            content: >-
              <ha-alert alert-type="warning">Gielz1986's hardware SOC floor caps
              at 50%. Setting Reserve SOC above 50% is still fully protected —
              just by our own automation watching live SOC, not the battery's
              own hardware floor above that point.</ha-alert>
            text_only: true
          - type: entities
            entities:
              - entity: input_number.zendure_night_reserve_soc
                name: Reserve SOC
              - entity: input_number.zendure_export_not_before_hour
                name: Don't Export Before Hour
              - entity: input_datetime.zendure_export_reminder_time
                name: Arm Reminder Time
              - entity: input_select.zendure_revert_mode
                name: Revert To Mode
              - entity: input_select.zendure_operation_mode
                name: Operation Mode (editable)
          - type: heading
            heading: Aircon Reserve Settings
            heading_style: title
            icon: mdi:snowflake-alert
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Paste the exact entity ID for each
              sensor below (e.g. sensor.bedroom1_temperature). Leave a field
              blank to skip that room.</ha-alert>
            text_only: true
          - type: entities
            entities:
              - entity: input_number.zendure_aircon_temp_threshold
                name: Temperature Threshold
          - type: horizontal-stack
            cards:
              - type: entities
                title: Bedroom 1
                show_header_toggle: false
                entities:
                  - entity: input_text.zendure_bedroom1_temp_sensor
                    name: Sensor
                  - entity: sensor.zendure_bedroom_1_temp_value
                    name: Value
                  - entity: input_text.zendure_bedroom1_airco
                    name: Airco
                  - entity: sensor.zendure_bedroom_1_airco_state
                    name: State
            grid_options:
              rows: auto
              columns: full
          - type: horizontal-stack
            cards:
              - type: entities
                title: Bedroom 2
                show_header_toggle: false
                entities:
                  - entity: input_text.zendure_bedroom2_temp_sensor
                    name: Sensor
                  - entity: sensor.zendure_bedroom_2_temp_value
                    name: Value
                  - entity: input_text.zendure_bedroom2_airco
                    name: Airco
                  - entity: sensor.zendure_bedroom_2_airco_state
                    name: State
          - type: horizontal-stack
            cards:
              - type: entities
                title: Bedroom 3
                show_header_toggle: false
                entities:
                  - entity: input_text.zendure_bedroom3_temp_sensor
                    name: Sensor
                  - entity: sensor.zendure_bedroom_3_temp_value
                    name: Value
                  - entity: input_text.zendure_bedroom3_airco
                    name: Airco
                  - entity: sensor.zendure_bedroom_3_airco_state
                    name: State
      - type: grid
        cards:
          - type: heading
            heading: Solar Reserve Settings
            heading_style: title
            icon: mdi:weather-cloudy-alert
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Blocks evening export when
              tomorrow's forecasted solar (Forecast.Solar, summed across all
              3 systems) falls below the threshold — preventing the battery
              being drained before a low-sun day when it may not fully
              recharge. Set threshold to 0 to disable this block
              entirely.</ha-alert>
            text_only: true
          - type: entities
            entities:
              - entity: sensor.zendure_solar_forecast_tomorrow
                name: Forecast Tomorrow (Combined)
              - entity: input_number.zendure_low_solar_threshold_kwh
                name: Low Solar Threshold
              - entity: binary_sensor.zendure_low_solar_tomorrow
                name: Currently Blocking?
              - entity: input_boolean.zendure_ignore_low_solar_forecast
                name: Ignore Today (Override)
      - type: grid
        cards:
          - type: heading
            heading: Notifications
            heading_style: title
            icon: mdi:bell-outline
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Enter the full notify service name for
              each phone (e.g. notify.mobile_app_johns_iphone) — find it under
              Developer Tools → Actions, search "notify". Leave a field blank to
              skip that phone.</ha-alert>
            text_only: true
          - type: entities
            entities:
              - entity: input_boolean.zendure_notifications_enabled
                name: Notifications Enabled
              - entity: input_text.zendure_notify_phone1
                name: Notify Phone 1
              - entity: input_text.zendure_notify_phone2
                name: Notify Phone 2
          - type: button
            name: Send Test Notification
            icon: mdi:bell-check-outline
            tap_action:
              action: perform-action
              perform_action: script.zendure_send_test_notification
              data: {}
            grid_options:
              columns: full
              rows: 2
  - type: sections
    max_columns: 4
    title: Proxy Details
    path: proxy-details
    sections:
      - type: grid
        cards:
          - type: entities
            title: Zendure Proxy Sensors
            entities:
              - entity: sensor.power_command
              - entity: sensor.zendure_1_power_command
              - entity: sensor.zendure_2_power_command
              - type: conditional
                conditions:
                  - entity: sensor.zendure_serial_number
                    state: 3x Zendure via PROXY
                row:
                  entity: sensor.zendure_3_power_command
              - entity: sensor.zendure_1_power
              - entity: sensor.zendure_2_power
              - type: conditional
                conditions:
                  - entity: sensor.zendure_serial_number
                    state: 3x Zendure via PROXY
                row:
                  entity: sensor.zendure_3_power
              - entity: sensor.zendure_active_device
                name: Active Device
              - entity: sensor.zendure_1_state_of_charge
              - entity: sensor.zendure_2_state_of_charge
              - type: conditional
                conditions:
                  - entity: sensor.zendure_serial_number
                    state: 3x Zendure via PROXY
                row:
                  entity: sensor.zendure_3_state_of_charge
              - entity: sensor.zendure_1_soc_limit_status
              - entity: sensor.zendure_2_soc_limit_status
              - type: conditional
                conditions:
                  - entity: sensor.zendure_serial_number
                    state: 3x Zendure via PROXY
                row:
                  entity: sensor.zendure_3_soc_limit_status
              - entity: sensor.zendure_1_storage_mode
              - entity: sensor.zendure_2_storage_mode
              - type: conditional
                conditions:
                  - entity: sensor.zendure_serial_number
                    state: 3x Zendure via PROXY
                row:
                  entity: sensor.zendure_3_storage_mode
              - entity: sensor.zendure_1_calibrating
              - entity: sensor.zendure_2_calibrating
              - type: conditional
                conditions:
                  - entity: sensor.zendure_serial_number
                    state: 3x Zendure via PROXY
                row:
                  entity: sensor.zendure_3_calibrating
              - entity: sensor.zendure_1_inverter_temperature
              - entity: sensor.zendure_2_inverter_temperature
              - type: conditional
                conditions:
                  - entity: sensor.zendure_serial_number
                    state: 3x Zendure via PROXY
                row:
                  entity: sensor.zendure_3_inverter_temperature
              - entity: sensor.zendure_1_offgrid_mode
              - entity: sensor.zendure_2_offgrid_mode
              - type: conditional
                conditions:
                  - entity: sensor.zendure_serial_number
                    state: 3x Zendure via PROXY
                row:
                  entity: sensor.zendure_3_offgrid_mode
              - type: conditional
                conditions:
                  - entity: sensor.zendure_1_offgrid_mode
                    state: Normal
                row:
                  entity: sensor.zendure_1_power_offgrid_outlet_1
                  name: Zendure 1 Power Offgrid Outlet
              - type: conditional
                conditions:
                  - entity: sensor.zendure_1_offgrid_mode
                    state: Eco
                row:
                  entity: sensor.zendure_1_power_offgrid_outlet_1
                  name: Zendure 1 Power Offgrid Outlet
              - type: conditional
                conditions:
                  - entity: sensor.zendure_2_offgrid_mode
                    state: Normal
                row:
                  entity: sensor.zendure_2_power_offgrid_outlet_1
                  name: Zendure 2 Power Offgrid Outlet
              - type: conditional
                conditions:
                  - entity: sensor.zendure_2_offgrid_mode
                    state: Eco
                row:
                  entity: sensor.zendure_2_power_offgrid_outlet_1
                  name: Zendure 2 Power Offgrid Outlet
              - type: conditional
                conditions:
                  - entity: sensor.zendure_3_offgrid_mode
                    state: Normal
                row:
                  entity: sensor.zendure_3_power_offgrid_outlet_1
                  name: Zendure 3 Power Offgrid Outlet
              - type: conditional
                conditions:
                  - entity: sensor.zendure_3_offgrid_mode
                    state: Eco
                row:
                  entity: sensor.zendure_3_power_offgrid_outlet_1
                  name: Zendure 3 Power Offgrid Outlet
              - entity: sensor.dual_mode_damper_status
              - entity: sensor.zendure_1_serial_number
              - entity: sensor.zendure_2_serial_number
              - type: conditional
                conditions:
                  - entity: sensor.zendure_serial_number
                    state: 3x Zendure via PROXY
                row:
                  entity: sensor.zendure_3_serial_number
              - entity: sensor.cached_response
              - entity: sensor.zendure_proxy_version
                name: Proxy Version
      - type: grid
        cards:
          - type: entities
            entities:
              - entity: switch.zendure_1_offgrid_socket
              - entity: switch.zendure_2_offgrid_socket
              - type: conditional
                conditions:
                  - entity: sensor.zendure_serial_number
                    state: 3x Zendure via PROXY
                row:
                  entity: switch.zendure_3_offgrid_socket
              - entity: switch.proxy_no_sleep_mode
              - entity: switch.all_active
              - entity: switch.equal_mode_charging
              - entity: switch.dual_mode_damper
          - type: entities
            title: Batteries
            entities:
              - type: conditional
                conditions:
                  - entity: sensor.zendure_battery_1_temperature
                    state_not: unknown
                  - entity: sensor.zendure_battery_1_temperature
                    state_not: unavailable
                row:
                  entity: sensor.zendure_battery_1_temperature
                  name: Battery 1 Temperature
              - type: conditional
                conditions:
                  - entity: sensor.zendure_battery_2_temperature
                    state_not: unknown
                  - entity: sensor.zendure_battery_2_temperature
                    state_not: unavailable
                row:
                  entity: sensor.zendure_battery_2_temperature
                  name: Battery 2 Temperature
              - type: conditional
                conditions:
                  - entity: sensor.zendure_battery_3_temperature
                    state_not: unknown
                  - entity: sensor.zendure_battery_3_temperature
                    state_not: unavailable
                row:
                  entity: sensor.zendure_battery_3_temperature
                  name: Battery 3 Temperature
              - type: divider
              - type: conditional
                conditions:
                  - entity: sensor.zendure_battery_1_state_of_charge
                    state_not: unknown
                  - entity: sensor.zendure_battery_1_state_of_charge
                    state_not: unavailable
                row:
