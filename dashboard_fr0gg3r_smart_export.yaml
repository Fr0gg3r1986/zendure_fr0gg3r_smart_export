                  - entity: sensor.zendure_battery_3_state_of_charge
                    state_not: unavailable
                row:
                  entity: sensor.zendure_battery_3_state_of_charge
                  name: Battery 3 State Of Charge
              - type: divider
              - type: conditional
                conditions:
                  - entity: sensor.zendure_battery_1_cell_balance_status
                    state_not: unknown
                  - entity: sensor.zendure_battery_1_cell_balance_status
