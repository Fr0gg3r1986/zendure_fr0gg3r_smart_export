                  - entity: sensor.zendure_battery_2_cell_balance_status
                    state_not: unavailable
                row:
                  entity: sensor.zendure_battery_2_cell_balance_status
                  name: Battery 2 Cell Balance
              - type: conditional
                conditions:
                  - entity: sensor.zendure_battery_3_cell_balance_status
                    state_not: unknown
                  - entity: sensor.zendure_battery_3_cell_balance_status
                    state_not: unavailable
                row:
                  entity: sensor.zendure_battery_3_cell_balance_status
                  name: Battery 3 Cell Balance
      - type: grid
        cards:
          - type: heading
            heading: SOC Diagnostic
            heading_style: title
            icon: mdi:scale-balance
          - type: markdown
            content: >-
              Gielz1986's raw combined SOC is a simple average across units, not
              weighted by capacity. This package computes a corrected weighted
              value (Real SOC %) used by all reserve/export logic. See the
              comparison below.
            text_only: true
          - type: glance
            show_name: true
            show_icon: true
            show_state: true
            entities:
              - entity: sensor.zendure_true_total_state_of_charge
                name: Real SOC % (weighted)
                icon: mdi:battery-medium
              - entity: sensor.zendure_total_state_of_charge
                name: Raw SOC % (unweighted)
              - entity: sensor.zendure_1_state_of_charge
                name: Unit 1
              - entity: sensor.zendure_2_state_of_charge
                name: Unit 2
